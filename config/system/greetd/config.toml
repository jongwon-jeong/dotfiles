[terminal]
vt = 1

[default_session]
# ReGreet searches /usr/local first so the adaptive launcher shadows Arch's
# stock Sway entry without modifying a package-owned file.
command = "env XDG_DATA_DIRS=/usr/local/share:/usr/share GTK_USE_PORTAL=0 GDK_DEBUG=no-portals dbus-run-session cage -s -mlast -d -- regreet --logs /dev/null --log-level warn --verbose --config /etc/greetd/regreet.toml --style /etc/greetd/regreet.css"
user = "greeter"
